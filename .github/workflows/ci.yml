name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint all markdown files
        run: markdownlint "**/*.md" --ignore node_modules

  structure:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for file in README.md LICENSE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md .gitignore; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Check all config files exist
        run: |
          expected_configs=(
            "zshrc"
            "gitconfig"
            "vscode-settings"
            "neovim"
            "tmux"
          )
          for config in "${expected_configs[@]}"; do
            if [ ! -f "configs/${config}.md" ]; then
              echo "ERROR: Missing config: configs/${config}.md"
              exit 1
            fi
          done
          echo "All config files present."

      - name: Check minimum file size
        run: |
          for file in configs/*.md; do
            lines=$(wc -l < "$file")
            if [ "$lines" -lt 100 ]; then
              echo "ERROR: $file has only $lines lines (minimum: 100)"
              exit 1
            fi
            echo "OK: $file ($lines lines)"
          done
